<!DOCTYPE html>
<!-- Synthetic CMS article shell for the Membership form page (same shell
     pattern as hh-form.html): mimics the article template structure and
     the CMS form wrapper — <form> around the paste + its own submit/reset.
     The paste itself is inlined from forms/membership.html by
     test/build-preview.js at the SB_FORM_INCLUDE token. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membership - Chabad of South Beach</title>
<link rel="stylesheet" href="/css/DefaultGrid.css">
<link rel="stylesheet" href="/css/Elements.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/new/main.css">
<link rel="stylesheet" href="/css/sites6/default-theme.css">
</head>
<body class="cco_body sites-article no-hero-image">
<div id="BodyContainer">
  <div class="body_wrapper">
    <div id="content">
      <div class="co_content_container" id="co_content_container">
        <div class="clearfix">
          <div class="g960">
            <div class="article-header">
              <h1 class="article-header__title">Membership</h1>
            </div>
            <div class="master-content-wrapper">
              <div id="ContentBody" class="content">
                <form method="post" action="#preview-no-submit">
<!--SB_FORM_INCLUDE-->
                  <div class="co_global_submit" style="text-align:center;padding:10px 0 40px;">
                    <input type="submit" class="button" value="Submit Membership">
                    <input type="reset" class="button" value="Reset">
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
